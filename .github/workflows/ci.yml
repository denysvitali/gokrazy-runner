name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  build:
    name: cross-build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/perm-init-linux-arm64 ./cmd/perm-init
          go build -trimpath -ldflags='-s -w' -o dist/runner-init-linux-arm64 ./cmd/runner-init

      - name: build linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/perm-init-linux-amd64 ./cmd/perm-init
          go build -trimpath -ldflags='-s -w' -o dist/runner-init-linux-amd64 ./cmd/runner-init

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: |
          shellcheck -x -S warning \
            scripts/gok-common.sh \
            scripts/build-ota-image.sh \
            setup-gokrazy.sh \
            .github/scripts/build-mke2fs-arm64.sh
